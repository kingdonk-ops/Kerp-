name: Lock refresh

# Weekly re-resolution of backend/requirements*.lock with `uv pip compile --upgrade`
# (scripts/refresh_locks.py; TD-047, T-0033). Dependabot covers the base image and the
# actions but cannot re-run uv. When a lock changed, the result is force-pushed to one branch
# and one PR to dev is opened (or kept: the push updates it). That PR goes through ci-gate and
# review-gate like any other. Only the workflow's GITHUB_TOKEN is used: no app, no PAT.
on:
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: lock-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the refresh branch (never dev: rulesets protect it)
      pull-requests: write # open the PR
      actions: write # start CI on the branch: events made with GITHUB_TOKEN start no workflow
    env:
      BRANCH: deps/uv-lock-refresh
      UV_VERSION: "0.13.9"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"
      - name: Re-resolve the locks
        run: python scripts/refresh_locks.py --upgrade
      - name: Changed?
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet -- 'backend/requirements*.lock'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Lock files are current: nothing to propose." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- 'backend/requirements*.lock'
          fi
      # The token reaches git only here, after uv has run (persist-credentials: false above).
      - name: Push the branch, open or keep the PR, start CI
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -- 'backend/requirements*.lock'
          git commit -q -m "chore(deps): refresh backend lock files (uv pip compile --upgrade)" \
            -m "Weekly lock refresh (TD-047): .github/workflows/lock-refresh.yml, scripts/refresh_locks.py."
          gh auth setup-git
          git push --force origin "HEAD:refs/heads/$BRANCH"
          number="$(gh pr list --head "$BRANCH" --base dev --state open --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            {
              echo "Weekly \`uv pip compile --upgrade\` of \`backend/requirements*.lock\` (TD-047)."
              echo
              echo "Generated by \`.github/workflows/lock-refresh.yml\` (\`scripts/refresh_locks.py\`)."
              echo "Review the version bumps; merge only after \`ci-gate\` and \`review-gate\` pass."
              echo
              echo '```'
              git diff --stat HEAD~1 -- 'backend/requirements*.lock'
              echo '```'
            } > "$RUNNER_TEMP/body.md"
            gh pr create --base dev --head "$BRANCH" \
              --title "chore(deps): refresh backend lock files" --body-file "$RUNNER_TEMP/body.md"
          else
            echo "PR #$number updated by the push."
          fi
          gh workflow run ci.yml --ref "$BRANCH"
          echo "Lock refresh pushed to \`$BRANCH\`; CI started." >> "$GITHUB_STEP_SUMMARY"
