name: Review gate

# A PR into dev needs an independent-review approval marker that matches the
# PR's current code (patch-id). See scripts/review_gate.py.
on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-gate:
    if: github.event.pull_request.base.ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      # The gate script comes from the PR's *base* (already reviewed), never from the PR head,
      # so a PR's edits to the script do not judge that PR. (pull_request runs the PR's copy of
      # this workflow file itself; that remaining path is TD-223.)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
          sparse-checkout: scripts
      # The PR head is only *read* (git diff → patch-id); none of its code runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Check approval
        working-directory: pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Logins whose KERP-REVIEW markers count. Agents act as the repo owner.
          ALLOWED_REVIEWERS: ${{ vars.KERP_ALLOWED_REVIEWERS || 'kingdonk-ops' }}
        run: python ../base/scripts/review_gate.py
