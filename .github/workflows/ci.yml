name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Actions are pinned to commit SHAs (tag in the trailing comment); Dependabot
# (.github/dependabot.yml) keeps the pins current. Checkouts never persist the token.
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.d.outputs.backend }}
      frontend: ${{ steps.d.outputs.frontend }}
      e2e: ${{ steps.d.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # PRs: diff against the merge base with the target branch
      # Components that exist run. On a pull_request (scripts/ci_changes.py): changes all under
      # tracker/, docs/ or .claude/ skip the app jobs; changes that are frontend-only besides
      # those skip the backend jobs (T-0083). ci-gate accepts "false" flags as expected skips.
      # Push and workflow_dispatch always run everything that exists.
      - id: d
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          skip_app=false
          backend_needed=true
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --name-only --no-renames "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/changed.txt"
            echo "changed files:"; cat "$RUNNER_TEMP/changed.txt"
            result="$(python3 scripts/ci_changes.py < "$RUNNER_TEMP/changed.txt")"
            echo "$result"
            grep -qx "docs_or_tracker_only=true" <<<"$result" && skip_app=true
            grep -qx "backend_needed=false" <<<"$result" && backend_needed=false
          fi
          flag() { [ "$skip_app" = false ] && [ -f "$1" ] && echo true || echo false; }
          backend_flag() { [ "$backend_needed" = true ] && flag backend/pyproject.toml || echo false; }
          {
            echo "backend=$(backend_flag)"
            echo "frontend=$(flag frontend/package.json)"
            echo "e2e=$(flag e2e/package.json)"
          } >> "$GITHUB_OUTPUT"

  tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # check-ids needs the base branch and the merge base
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate tracker
        run: python scripts/tracker.py validate
      - name: TODO ids do not collide with base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/tracker.py check-ids --base "origin/$BASE_REF" --head "$HEAD_SHA"
      - name: Boards up to date
        run: python scripts/tracker.py render --check
      - name: Pipeline script tests
        run: |
          python -m pip install -q pytest
          python -m pytest -q scripts/tests
      - name: Board summary
        if: always()
        run: |
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          python scripts/tracker.py stats >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # Backend lint + types + the full suite on SQLite, in parallel workers (T-0081). Agents in
  # cloud sessions have no PostgreSQL, so this is their local gate too; CI keeps it green.
  backend:
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # The backend defaults to production (T-0070); the test job opts in explicitly.
    env:
      KERP_ENVIRONMENT: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy app
      - name: Tests (SQLite)
        run: pytest -n auto --durations=25

  # The full suite again on PostgreSQL 16 + PostGIS + ltree as the NOSUPERUSER NOBYPASSRLS
  # runtime role, so RLS applies (T-0082). Runs in parallel with `backend` (T-0081), split into
  # parallel shards by test file (T-0086, scripts/shard_tests.py): every test file runs in
  # exactly one shard. The coverage floor is enforced on all shards combined, in
  # backend-pg-coverage. needs.backend-pg.result is the matrix aggregate: one shard failing,
  # cancelled or skipped makes it non-success, and ci-gate fails.
  backend-pg:
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # report every failing shard, not only the first
      matrix:
        shard: [1, 2, 3, 4] # backend-pg-coverage's SHARDS must equal the count (test_workflows)
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: kerp
          POSTGRES_PASSWORD: kerp
          POSTGRES_DB: kerp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kerp" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        # Tag kept for readability; the digest decides what is pulled (compose uses the same).
        image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe # redis:7-alpine
        ports: ["6379:6379"]
    env:
      KERP_ENVIRONMENT: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      # Same script docker-compose.yml runs locally (make test-pg): ltree + postgis and the
      # NOSUPERUSER NOBYPASSRLS role kerp_app. tests/test_dev_infra.py keeps them in sync.
      - name: Create non-superuser app role (RLS must not be bypassed)
        env:
          PGPASSWORD: kerp
        run: >-
          psql -h localhost -U kerp -d kerp_test -v ON_ERROR_STOP=1
          -f ../infra/postgres/initdb/20-kerp-app.sql
      # Throwaway database: trade crash safety for speed (T-0082). Service `options` are docker
      # flags, not server flags, so set them at runtime; all three apply on reload.
      - name: Postgres without durability (CI only)
        env:
          PGPASSWORD: kerp
        run: >-
          psql -h localhost -U kerp -d kerp_test -v ON_ERROR_STOP=1
          -c "ALTER SYSTEM SET fsync = off"
          -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off"
          -c "SELECT pg_reload_conf()"
          -c "SHOW fsync"
      # Each test gets its own copy of a per-worker migrated template database
      # (tests/pg_databases.py), so the workers never share a database (T-0082). This shard
      # runs only its own files; an empty slice fails (pytest without paths would run all).
      # The per-shard floor is off (--cov-fail-under=0): the floor from pyproject.toml applies
      # to the combined data in backend-pg-coverage. The JUnit report (xunit1: per-file
      # timings) feeds scripts/shard_tests.py weights when rebalancing. The step name is read by
      # backend/tests/test_dev_infra.py (Makefile defaults = this env).
      - name: Tests (PostgreSQL + RLS)
        env:
          KERP_DATABASE_URL: postgresql+psycopg://kerp_app:kerp_app@localhost:5432/kerp_test
          KERP_TEST_OWNER_URL: postgresql+psycopg://kerp:kerp@localhost:5432/kerp_test
          KERP_REDIS_URL: redis://localhost:6379/0
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          python ../scripts/shard_tests.py files --shard "$SHARD" --of "$SHARDS" \
            > "$RUNNER_TEMP/shard-files.txt"
          mapfile -t files < "$RUNNER_TEMP/shard-files.txt"
          echo "shard $SHARD/$SHARDS: ${#files[@]} test files"
          [ "${#files[@]}" -gt 0 ]
          pytest -n auto --durations=25 --cov-fail-under=0 \
            -o junit_family=xunit1 --junitxml="junit-pg-$SHARD.xml" "${files[@]}"
          mv .coverage ".coverage.pg-$SHARD"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-pg-${{ matrix.shard }}
          path: |
            backend/.coverage.pg-${{ matrix.shard }}
            backend/junit-pg-${{ matrix.shard }}.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # The PostgreSQL shards together (T-0086): the shards' collections must add up to the full
  # suite, each test exactly once, and the combined coverage of all shards must reach the same
  # floor as before (read from backend/pyproject.toml, never copied here).
  backend-pg-coverage:
    needs: [detect, backend-pg]
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      KERP_ENVIRONMENT: test
      SHARDS: 4 # = the backend-pg matrix size (test_workflows)
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Shards cover the full collection exactly once
        run: python ../scripts/shard_tests.py verify-collection --of "$SHARDS"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-pg-*
          merge-multiple: true
          path: ${{ runner.temp }}/pg-coverage
      - name: Combined coverage floor (all shards)
        run: |
          set -euo pipefail
          ls -la "$RUNNER_TEMP/pg-coverage"
          for n in $(seq 1 "$SHARDS"); do
            [ -s "$RUNNER_TEMP/pg-coverage/.coverage.pg-$n" ] \
              || { echo "::error::coverage data of shard $n is missing"; exit 1; }
          done
          found="$(find "$RUNNER_TEMP/pg-coverage" -name '.coverage.*' | wc -l)"
          [ "$found" -eq "$SHARDS" ] # no stray data file from anything but the shards
          floor="$(python ../scripts/shard_tests.py coverage-floor)"
          echo "coverage floor (pyproject.toml): $floor%"
          coverage combine "$RUNNER_TEMP/pg-coverage"
          coverage report --show-missing --fail-under="$floor"

  # The production database layout (T-0343, ADR 0019): kerp_owner owns schema public and runs
  # every migration (KERP_TEST_MIGRATION_URL); the suite runs as kerp_app, which owns nothing
  # and has only the grants of migration 0039 (backend-pg keeps kerp_app as the owner, TD-056).
  # One job, not sharded: it proves the grants on the full PostgreSQL suite (every test that
  # uses the migrated fixtures reads and writes kerp_owner's tables as kerp_app), with the
  # coverage floor of pyproject.toml; the backend-pg shards keep the fast path.
  backend-pg-roles:
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: kerp
          POSTGRES_PASSWORD: kerp
          POSTGRES_DB: kerp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kerp" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        # Tag kept for readability; the digest decides what is pulled (compose uses the same).
        image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe # redis:7-alpine
        ports: ["6379:6379"]
    env:
      KERP_ENVIRONMENT: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Create non-superuser app role (RLS must not be bypassed)
        env:
          PGPASSWORD: kerp
        run: >-
          psql -h localhost -U kerp -d kerp_test -v ON_ERROR_STOP=1
          -f ../infra/postgres/initdb/20-kerp-app.sql
      - name: Split owner and runtime roles (kerp_owner owns, kerp_app owns nothing)
        env:
          PGPASSWORD: kerp
        run: >-
          psql -h localhost -U kerp -d kerp_test -v ON_ERROR_STOP=1
          -f ../infra/postgres/owner-runtime-split.sql
      - name: Postgres without durability (CI only)
        env:
          PGPASSWORD: kerp
        run: >-
          psql -h localhost -U kerp -d kerp_test -v ON_ERROR_STOP=1
          -c "ALTER SYSTEM SET fsync = off"
          -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off"
          -c "SELECT pg_reload_conf()"
          -c "SHOW fsync"
      # A copy of the (empty) source, migrated as the owner; then, as kerp_app: the startup
      # checks of T-0342 report nothing, and kerp_app owns nothing and may create nothing.
      - name: Migrate as kerp_owner, startup role checks pass as kerp_app
        env:
          PGPASSWORD: kerp
          KERP_MIGRATION_DATABASE_URL: postgresql+psycopg://kerp_owner:kerp_owner@localhost:5432/kerp_roles
          KERP_DATABASE_URL: postgresql+psycopg://kerp_app:kerp_app@localhost:5432/kerp_roles
          KERP_RUNTIME_DB_ROLE: kerp_app
        run: |
          set -euo pipefail
          psql -h localhost -U kerp -d kerp_test -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE kerp_roles TEMPLATE kerp_test" \
            -c "GRANT CONNECT, TEMPORARY ON DATABASE kerp_roles TO kerp_owner, kerp_app"
          alembic upgrade head
          python -m app.core.startup_safety
          owned="$(psql -h localhost -U kerp -d kerp_roles -Atc \
            "SELECT count(*) FROM pg_class WHERE relowner = 'kerp_app'::regrole")"
          create="$(psql -h localhost -U kerp -d kerp_roles -Atc \
            "SELECT has_schema_privilege('kerp_app', 'public', 'CREATE')")"
          ledger="$(psql -h localhost -U kerp -d kerp_roles -Atc \
            "SELECT has_table_privilege('kerp_app', 'audit_ledger', 'UPDATE')
              OR has_table_privilege('kerp_app', 'audit_ledger', 'DELETE')")"
          echo "kerp_app owns $owned objects; CREATE on public: $create; ledger UPDATE/DELETE: $ledger"
          [ "$owned" = "0" ] && [ "$create" = "f" ] && [ "$ledger" = "f" ]
      # Test-only, after the production-layout check above and on the test source database
      # only: some tests build their own scratch tables or migrate an empty database as the
      # runtime role (tenancy contract tests, migration tests). CREATE lets them; it gives
      # kerp_app nothing on kerp_owner's tables.
      - name: Let kerp_app create scratch tables in the test databases
        env:
          PGPASSWORD: kerp
        run: >-
          psql -h localhost -U kerp -d kerp_test -v ON_ERROR_STOP=1
          -c "GRANT CREATE ON SCHEMA public TO kerp_app"
      # Each test's database is a copy of a per-worker template that kerp_owner migrated
      # (tests/pg_databases.py: KERP_TEST_MIGRATION_URL); the tests connect as kerp_app.
      - name: Tests (PostgreSQL, owner/runtime split)
        env:
          KERP_DATABASE_URL: postgresql+psycopg://kerp_app:kerp_app@localhost:5432/kerp_test
          KERP_TEST_OWNER_URL: postgresql+psycopg://kerp:kerp@localhost:5432/kerp_test
          KERP_TEST_MIGRATION_URL: postgresql+psycopg://kerp_owner:kerp_owner@localhost:5432/kerp_test
          KERP_RUNTIME_DB_ROLE: kerp_app
          KERP_REDIS_URL: redis://localhost:6379/0
        run: pytest -n auto --durations=25

  # Backend container image (T-0004): build + smoke test on every run, read-only token.
  # On a push the smoke-tested image itself is saved and handed to backend-publish (TD-051).
  backend-image:
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    outputs:
      image-id: ${{ steps.save.outputs.image-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # OCI labels go into the image here (source links the GHCR package to the repo): the
      # published image is this one, byte for byte, so publish cannot add them later.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/kingdonk-ops/kerp-backend
      - name: Build (load for smoke test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          load: true
          push: false
          tags: kerp-backend:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image
      - name: Smoke test (non-root, /health, HEALTHCHECK)
        run: |
          uid="$(docker run --rm --entrypoint id kerp-backend:ci -u)"
          echo "uid=$uid"; [ "$uid" != "0" ]
          # Production startup requires the deployment tenant (T-0037, diff §4.1); a synthetic
          # UUID, not a real tenant. Production also requires outbound e-mail (T-0058, diff §4.6):
          # synthetic SES settings; nothing calls AWS at startup (boto3 is imported lazily, in
          # the worker). And Redis plus a JWT signing key (T-0342): a throwaway Redis on a
          # private network and a key generated for this run only (never stored).
          mail=(-e KERP_MAIL_TRANSPORT=ses -e KERP_MAIL_FROM_ADDRESS=no-reply@example.test
            -e KERP_MAIL_SNS_TOPIC_ARN=arn:aws:sns:ap-southeast-2:000000000000:kerp-mail-smoke
            -e KERP_WEB_ORIGIN=https://kerp.example.test)
          docker network create kerp-smoke-net
          docker run -d --name kerp-smoke-redis --network kerp-smoke-net \
            redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
          jwt_key="$(openssl genpkey -algorithm ed25519)"
          runtime=(--network kerp-smoke-net -e KERP_REDIS_URL=redis://kerp-smoke-redis:6379/0
            -e KERP_JWT_PRIVATE_KEY="$jwt_key")
          docker run -d --name kerp-smoke -p 8000:8000 "${mail[@]}" "${runtime[@]}" \
            -e KERP_DEFAULT_TENANT_ID=00000000-0000-4000-8000-00000000c1c1 kerp-backend:ci
          for _ in $(seq 1 30); do
            if body="$(curl -fsS http://127.0.0.1:8000/health)"; then break; fi
            sleep 1
          done
          echo "health: ${body:-<none>}"
          echo "$body" | grep -q '"status":"ok"'
          for _ in $(seq 1 30); do
            health="$(docker inspect --format '{{.State.Health.Status}}' kerp-smoke)"
            [ "$health" = "healthy" ] && break
            sleep 2
          done
          echo "docker health: $health"; [ "$health" = "healthy" ]
          # Negative check: production without the tenant must fail fast, not serve.
          rc=0
          out="$(timeout 60 docker run --rm --name kerp-no-tenant kerp-backend:ci 2>&1)" || rc=$?
          echo "no-tenant exit: $rc"
          [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]
          echo "$out" | grep -q 'KERP_DEFAULT_TENANT_ID must be set'
          # Negative check: production without an e-mail transport must fail fast (T-0058).
          rc=0
          out="$(timeout 60 docker run --rm --name kerp-no-mail \
            -e KERP_DEFAULT_TENANT_ID=00000000-0000-4000-8000-00000000c1c1 kerp-backend:ci 2>&1)" \
            || rc=$?
          echo "no-mail exit: $rc"
          [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]
          echo "$out" | grep -q 'KERP_MAIL_TRANSPORT=ses'
          # Negative check: production without Redis must fail fast (T-0342, TD-124).
          rc=0
          out="$(timeout 60 docker run --rm --name kerp-no-redis "${mail[@]}" \
            -e KERP_JWT_PRIVATE_KEY="$jwt_key" \
            -e KERP_DEFAULT_TENANT_ID=00000000-0000-4000-8000-00000000c1c1 kerp-backend:ci 2>&1)" \
            || rc=$?
          echo "no-redis exit: $rc"
          [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]
          echo "$out" | grep -q 'KERP_REDIS_URL must be set in production'
          # Negative check: production without a JWT signing key must fail fast (T-0342).
          rc=0
          out="$(timeout 60 docker run --rm --name kerp-no-key "${mail[@]}" \
            --network kerp-smoke-net -e KERP_REDIS_URL=redis://kerp-smoke-redis:6379/0 \
            -e KERP_DEFAULT_TENANT_ID=00000000-0000-4000-8000-00000000c1c1 kerp-backend:ci 2>&1)" \
            || rc=$?
          echo "no-key exit: $rc"
          [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]
          echo "$out" | grep -q 'KERP_JWT_PRIVATE_KEY or KERP_JWT_PRIVATE_KEY_FILE must be set'
          # The same image runs the SAQ job worker (T-0015, compose service "worker").
          docker run --rm kerp-backend:ci python -c "import app.modules.jobs.worker"
      - name: Container logs
        if: always()
        run: docker logs kerp-smoke || true
      # Only after the smoke test passed (no always()): the image id is the content digest
      # backend-publish must find again after docker load and in the registry.
      - name: Save the smoke-tested image
        id: save
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          docker save kerp-backend:ci -o "$RUNNER_TEMP/backend-image.tar"
          id="$(docker image inspect --format '{{.Id}}' kerp-backend:ci)"
          echo "tested image: $id"
          echo "image-id=$id" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: backend-image
          path: ${{ runner.temp }}/backend-image.tar
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  # Pushes to dev/main only, after tests (both database layouts, T-0343) and the smoke test
  # passed: publish to GHCR.
  # The only job allowed to write packages (T-0028). It pushes the image backend-image
  # smoke-tested (saved there, loaded here), never a rebuild, and checks by digest that the
  # registry serves exactly that image (TD-051).
  backend-publish:
    needs: [detect, backend, backend-pg, backend-pg-coverage, backend-pg-roles, backend-image]
    if: github.event_name == 'push' && needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/kingdonk-ops/kerp-backend
      TESTED_ID: ${{ needs.backend-image.outputs.image-id }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-image
          path: ${{ runner.temp }}/backend-image
      - name: Load the smoke-tested image
        run: |
          set -euo pipefail
          docker load -i "$RUNNER_TEMP/backend-image/backend-image.tar"
          loaded="$(docker image inspect --format '{{.Id}}' kerp-backend:ci)"
          echo "tested: $TESTED_ID"; echo "loaded: $loaded"
          [ -n "$TESTED_ID" ] && [ "$loaded" = "$TESTED_ID" ]
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/kingdonk-ops/kerp-backend
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=branch
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image to GHCR
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/digests"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag kerp-backend:ci "$tag"
            docker push "$tag" | tee "$RUNNER_TEMP/push.log"
            grep -o 'digest: sha256:[0-9a-f]\{64\}' "$RUNNER_TEMP/push.log" | cut -d' ' -f2 \
              >> "$RUNNER_TEMP/digests" || true
          done <<< "$TAGS"
          # Fallback: the registry digests docker recorded for the image.
          docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' kerp-backend:ci \
            | sed -n "s|^$IMAGE@||p" >> "$RUNNER_TEMP/digests"
          # Every tag must point at one manifest, and pulling it back must give the tested id.
          mapfile -t digests < <(sort -u "$RUNNER_TEMP/digests")
          echo "registry digests: ${digests[*]:-none}"
          [ "${#digests[@]}" -eq 1 ]
          ref="$IMAGE@${digests[0]}"
          docker pull -q "$ref"
          pushed="$(docker image inspect --format '{{.Id}}' "$ref")"
          echo "pushed: $ref -> $pushed"
          [ "$pushed" = "$TESTED_ID" ]
          {
            echo "### Published backend image"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Smoke-tested image id | \`$TESTED_ID\` |"
            echo "| Pushed (registry digest) | \`$ref\` |"
            echo "| Resolves to | \`$pushed\` (= tested) |"
            echo "| Tags | $(tr '\n' ' ' <<< "$TAGS") |"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  # NFR performance budgets (T-0045, diff §6.3): headless Chrome, 4x CPU throttle; budgets and
  # profile in frontend/src/perf/budgets.json. Runs on every PR (so on every PR touching
  # frontend/). A breach is a ::warning annotation + job summary row, not a failure, until
  # T-0146 sets enforcement to "fail"; a broken measurement fails the job (and ci-gate).
  perf:
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: NFR budgets (warn-only)
        run: npm run perf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-results
          path: frontend/perf-results.json
          if-no-files-found: ignore

  # Playwright journeys on the real stack (T-0027): the same PostgreSQL service + init script as
  # backend-pg (RLS applies: the API runs as kerp_app), Redis, the API (uvicorn, development)
  # and the built frontend, both started by e2e/playwright.config.ts. See e2e/README.md.
  e2e:
    needs: [detect, backend, backend-pg, backend-pg-coverage, frontend]
    if: always() && needs.detect.outputs.e2e == 'true' && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: kerp
          POSTGRES_PASSWORD: kerp
          POSTGRES_DB: kerp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kerp" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        # Tag kept for readability; the digest decides what is pulled (compose uses the same).
        image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe # redis:7-alpine
        ports: ["6379:6379"]
    env:
      KERP_E2E_DATABASE_URL: postgresql+psycopg://kerp_app:kerp_app@localhost:5432/kerp_test
      KERP_E2E_REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      # The seed lives outside backend/, so the backend job's ruff does not see it.
      - name: Lint seed
        run: ruff check --config ../backend/pyproject.toml seed
      # Same script as backend-pg and docker-compose.yml: ltree + postgis and the NOSUPERUSER
      # NOBYPASSRLS runtime role kerp_app (globalSetup refuses any other role).
      - name: Create non-superuser app role (RLS must not be bypassed)
        env:
          PGPASSWORD: kerp
        run: >-
          psql -h localhost -U kerp -d kerp_test -v ON_ERROR_STOP=1
          -f ../infra/postgres/initdb/20-kerp-app.sql
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            e2e/package-lock.json
            frontend/package-lock.json
      # The suite builds and previews the frontend itself (playwright.config.ts webServer).
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - run: npm ci && npx playwright install --with-deps chromium
      - name: Lint + types (suite)
        run: npm run lint && npm run typecheck
      - run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report

  # Single required check for branch rules. Passes only if every job succeeded or skipped
  # because it is expected to (component absent, or publish on a non-push) — scripts/ci_gate.py.
  ci-gate:
    needs: [detect, tracker, backend, backend-pg, backend-pg-coverage, backend-pg-roles, backend-image, backend-publish, frontend, perf, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: All jobs green
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci_gate.py
