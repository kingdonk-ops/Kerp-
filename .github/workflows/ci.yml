name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Actions are pinned to commit SHAs (tag in the trailing comment); Dependabot
# (.github/dependabot.yml) keeps the pins current. Checkouts never persist the token.
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.d.outputs.backend }}
      frontend: ${{ steps.d.outputs.frontend }}
      e2e: ${{ steps.d.outputs.e2e }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: d
        run: |
          echo "backend=$([ -f backend/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "frontend=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "e2e=$([ -f e2e/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0 # check-ids needs the base branch and the merge base
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate tracker
        run: python scripts/tracker.py validate
      - name: TODO ids do not collide with base
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/tracker.py check-ids
          --base "origin/${{ github.base_ref }}"
          --head "${{ github.event.pull_request.head.sha }}"
      - name: Boards up to date
        run: python scripts/tracker.py render --check
      - name: Pipeline script tests
        run: |
          python -m pip install -q pytest
          python -m pytest -q scripts/tests
      - name: Board summary
        if: always()
        run: |
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          python scripts/tracker.py stats >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  backend:
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: kerp
          POSTGRES_PASSWORD: kerp
          POSTGRES_DB: kerp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kerp" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy app
      - name: Tests (SQLite)
        run: pytest
      # Same script docker-compose.yml runs locally (make test-pg): ltree + postgis and the
      # NOSUPERUSER NOBYPASSRLS role kerp_app. tests/test_dev_infra.py keeps them in sync.
      - name: Create non-superuser app role (RLS must not be bypassed)
        env:
          PGPASSWORD: kerp
        run: >-
          psql -h localhost -U kerp -d kerp_test -v ON_ERROR_STOP=1
          -f ../infra/postgres/initdb/20-kerp-app.sql
      - name: Tests (PostgreSQL + RLS)
        env:
          KERP_DATABASE_URL: postgresql+psycopg://kerp_app:kerp_app@localhost:5432/kerp_test
          KERP_TEST_OWNER_URL: postgresql+psycopg://kerp:kerp@localhost:5432/kerp_test
          KERP_REDIS_URL: redis://localhost:6379/0
        # exit 5 = no tests collected (before the DB layer exists) — allowed
        run: pytest --no-cov || [ $? -eq 5 ]

  # Backend container image (T-0004): build + smoke test on every run, read-only token.
  backend-image:
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build (load for smoke test)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          load: true
          push: false
          tags: kerp-backend:ci
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image
      - name: Smoke test (non-root, /health, HEALTHCHECK)
        run: |
          uid="$(docker run --rm --entrypoint id kerp-backend:ci -u)"
          echo "uid=$uid"; [ "$uid" != "0" ]
          docker run -d --name kerp-smoke -p 8000:8000 kerp-backend:ci
          for _ in $(seq 1 30); do
            if body="$(curl -fsS http://127.0.0.1:8000/health)"; then break; fi
            sleep 1
          done
          echo "health: ${body:-<none>}"
          echo "$body" | grep -q '"status":"ok"'
          for _ in $(seq 1 30); do
            health="$(docker inspect --format '{{.State.Health.Status}}' kerp-smoke)"
            [ "$health" = "healthy" ] && break
            sleep 2
          done
          echo "docker health: $health"; [ "$health" = "healthy" ]
          # The same image runs the SAQ job worker (T-0015, compose service "worker").
          docker run --rm kerp-backend:ci python -c "import app.modules.jobs.worker"
      - name: Container logs
        if: always()
        run: docker logs kerp-smoke || true

  # Pushes to dev/main only, after tests and the smoke test passed: publish to GHCR.
  # The only job allowed to write packages (T-0028).
  backend-publish:
    needs: [detect, backend, backend-image]
    if: github.event_name == 'push' && needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/kingdonk-ops/kerp-backend
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=branch
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to GHCR
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend-image

  frontend:
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    needs: [detect, backend, frontend]
    if: always() && needs.detect.outputs.e2e == 'true' && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci && npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report

  # Single required check for branch rules. Passes only if every job succeeded or skipped
  # because it is expected to (component absent, or publish on a non-push) — scripts/ci_gate.py.
  ci-gate:
    needs: [detect, tracker, backend, backend-image, backend-publish, frontend, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: All jobs green
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci_gate.py
