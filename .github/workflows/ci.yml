name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.d.outputs.backend }}
      frontend: ${{ steps.d.outputs.frontend }}
      e2e: ${{ steps.d.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          echo "backend=$([ -f backend/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "frontend=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "e2e=$([ -f e2e/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate tracker
        run: python scripts/tracker.py validate
      - name: Boards up to date
        run: python scripts/tracker.py render --check
      - name: Pipeline script tests
        run: |
          python -m pip install -q pytest
          python -m pytest -q scripts/tests
      - name: Board summary
        if: always()
        run: |
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          python scripts/tracker.py stats >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  backend:
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: kerp
          POSTGRES_PASSWORD: kerp
          POSTGRES_DB: kerp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kerp" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          if grep -qE '^\s*postgres\s*=' pyproject.toml; then pip install -e ".[dev,postgres]"; else pip install -e ".[dev]"; fi
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy app
      - name: Tests (SQLite)
        run: pytest
      - name: Create non-superuser app role (RLS must not be bypassed)
        env:
          PGPASSWORD: kerp
        run: |
          psql -h localhost -U kerp -d kerp_test -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE kerp_app LOGIN PASSWORD 'kerp_app' NOSUPERUSER NOBYPASSRLS;
             GRANT ALL ON DATABASE kerp_test TO kerp_app;
             ALTER SCHEMA public OWNER TO kerp_app;"
      - name: Tests (PostgreSQL + RLS)
        env:
          KERP_DATABASE_URL: postgresql+psycopg://kerp_app:kerp_app@localhost:5432/kerp_test
          KERP_TEST_OWNER_URL: postgresql+psycopg://kerp:kerp@localhost:5432/kerp_test
          KERP_REDIS_URL: redis://localhost:6379/0
        # exit 5 = no tests collected (before the DB layer exists) — allowed
        run: pytest --no-cov || [ $? -eq 5 ]

  frontend:
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    needs: [detect, backend, frontend]
    if: always() && needs.detect.outputs.e2e == 'true' && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report

  # Single required check for branch rules. Skipped jobs (component not built yet) count as pass.
  ci-gate:
    needs: [tracker, backend, frontend, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All jobs green
        run: |
          echo "tracker=${{ needs.tracker.result }} backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }} e2e=${{ needs.e2e.result }}"
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then exit 1; fi
