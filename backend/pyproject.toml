[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kerp-backend"
version = "0.1.0"
description = "KERP Field Operations Platform - backend (FastAPI modular monolith)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16",
    "boto3>=1.35",  # S3/MinIO object storage, presigned URLs (app/modules/uploads); lazy import
    "cel-python>=0.5,<0.6",
    "fastapi>=0.121",
    "google-re2>=1.1",  # RE2 regex rules, linear time (app/modules/validation, ADR 0004 §6)
    "lark>=1.1",  # celpy parse trees (used by app/core/cel)
    "pydantic>=2.7",
    "pyjwt[crypto]>=2.10",  # RS256/EdDSA access + refresh tokens (app/core/auth)
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",  # system default rule-set seed files (app/modules/validation, ADR 0004 §2.1)
    "redis>=5.2",  # jti / session revocation store (app/core/auth); SAQ caps it below 8
    "saq[redis]>=0.26,<0.27",  # job queue over Redis: interactive + batch queues (app/modules/jobs)
    "sqlalchemy>=2.0.36",
    "tzdata>=2024.1",  # IANA zone list for project site timezones (app/modules/projects)
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "boto3-stubs[s3]>=1.35",  # mypy --strict types for the lazily imported boto3 S3 client
    "fakeredis>=2.26",  # in-process Redis for the auth revocation tests
    "httpx>=0.27",
    "mypy>=1.11",
    "packaging>=24.0",  # tests/test_container.py parses the lock files
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",  # mypy --strict types for pyyaml (rule-set seed files)
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "C4", "PT", "ANN", "TID253"]

[tool.ruff.lint.flake8-tidy-imports]
# CLAUDE.md §6 / T-0022: heavy libs are imported lazily (inside the function or
# worker task that needs them; `if TYPE_CHECKING:` is fine). Submodules are covered.
# TID253 flags plain top-level imports only; imports nested at module scope (try/if/
# with/class body) are caught by the AST test in tests/test_lint_heavy_imports.py,
# which reads this same list.
banned-module-level-imports = [
    "boto3",        # AWS SDK (S3/MinIO object storage, app/modules/uploads)
    "botocore",     # boto3's core (clients, presigning, errors)
    "celpy",        # CEL rule evaluator (server-side sync payload validation)
    "cv2",          # OpenCV (drawing / image processing)
    "fitz",         # PyMuPDF, legacy import name (PDF compile / text extraction)
    "lark",         # CEL parser (celpy dependency; parse trees in app/core/cel)
    "pyhanko",      # PAdES signing at turnover
    "pymupdf",      # PyMuPDF, current import name
    "pytesseract",  # Tesseract OCR (calibration certs, dockets, MTRs)
    "rectpack",     # 2D sheet/plate nesting
    "re2",          # google-re2 (regex rules compile, app/modules/validation)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["app"]
