[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kerp-backend"
version = "0.1.0"
description = "KERP Field Operations Platform - backend (FastAPI modular monolith)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "C4", "PT", "ANN", "TID253"]

[tool.ruff.lint.flake8-tidy-imports]
# CLAUDE.md §6 / T-0022: heavy libs are imported lazily (inside the function or
# worker task that needs them; `if TYPE_CHECKING:` is fine). Submodules are covered.
banned-module-level-imports = [
    "celpy",        # CEL rule evaluator (server-side sync payload validation)
    "cv2",          # OpenCV (drawing / image processing)
    "fitz",         # PyMuPDF, legacy import name (PDF compile / text extraction)
    "pyhanko",      # PAdES signing at turnover
    "pymupdf",      # PyMuPDF, current import name
    "pytesseract",  # Tesseract OCR (calibration certs, dockets, MTRs)
    "rectpack",     # 2D sheet/plate nesting
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["app"]
