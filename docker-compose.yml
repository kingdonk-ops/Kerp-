# KERP local dev stack (T-0003): PostgreSQL 16 + PostGIS + ltree, Redis 7, MinIO,
# and the SAQ job worker (T-0015) with the ClamAV scanner (T-0218), profile "worker".
# Dev only: fixed throwaway credentials, ports bound to localhost. Use `make up` / `make test-pg`
# (see Makefile and backend/README.md "Local PostgreSQL stack").
#
# postgres and redis mirror the service containers of CI's backend job
# (.github/workflows/ci.yml); backend/tests/test_dev_infra.py fails if they drift.
name: kerp

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: kerp
      POSTGRES_PASSWORD: kerp
      POSTGRES_DB: kerp_test
    ports:
      - "127.0.0.1:${KERP_PG_PORT:-5432}:5432"
    volumes:
      - kerp-pg-data:/var/lib/postgresql/data
      # Same script CI runs: ltree + postgis, and the NOSUPERUSER NOBYPASSRLS role kerp_app.
      # Mounted as a single file so the image's own /docker-entrypoint-initdb.d/10_postgis.sh stays.
      - ./infra/postgres/initdb/20-kerp-app.sql:/docker-entrypoint-initdb.d/20-kerp-app.sql:ro
    healthcheck:
      # TCP, not the Unix socket: during initdb only the socket is up, before kerp_app exists.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U kerp -d kerp_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    ports:
      - "127.0.0.1:${KERP_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${KERP_MINIO_ROOT_USER:-kerp-minio}
      MINIO_ROOT_PASSWORD: ${KERP_MINIO_ROOT_PASSWORD:-kerp-minio-dev-only}
    ports:
      - "127.0.0.1:${KERP_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${KERP_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - kerp-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 15

  # ClamAV malware scanner (T-0218, TD-211) for the upload verify job: clamd on TCP 3310.
  # Opt-in with the worker (profile "worker", or "scanner" alone): the first start downloads
  # the signature database (freshclam), which takes a few minutes and needs the network.
  # Until clamd answers, uploads stay `verifying` and the verify job retries with back-off.
  # clamd scans streams up to its StreamMaxLength (ClamAV default 25M); the worker below
  # refuses larger files itself (KERP_UPLOAD_SCAN_MAX_BYTES), they end `verify_failed`.
  clamd:
    profiles: ["worker", "scanner"]
    image: clamav/clamav:1.4.3
    ports:
      - "127.0.0.1:${KERP_CLAMD_PORT:-3310}:3310"
    volumes:
      - kerp-clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

  # SAQ worker (T-0015): the backend image running both job queues (interactive + batch).
  # Opt-in profile, so `make up` stays fast: `make worker` builds and starts it.
  # Run the migrations first (`alembic upgrade head`) so oe_jobs_job exists.
  # Uploads are scanned by the clamd service above (T-0218).
  worker:
    profiles: ["worker"]
    build: ./backend
    command: ["python", "-m", "app.modules.jobs.worker"]
    environment:
      KERP_ENVIRONMENT: development
      KERP_DATABASE_URL: postgresql+psycopg://kerp_app:kerp_app@postgres:5432/kerp_test
      KERP_REDIS_URL: redis://redis:6379/0
      KERP_UPLOAD_SCANNER: clamd
      KERP_CLAMD_ADDRESS: tcp://clamd:3310
      KERP_UPLOAD_SCAN_MAX_BYTES: "26214400"  # clamd's default StreamMaxLength (25M)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Started, not healthy: the signature download may take minutes; the verify job
      # retries until clamd answers.
      clamd:
        condition: service_started
    # The image's HEALTHCHECK probes the API's /health; the worker serves no HTTP.
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  kerp-pg-data:
  kerp-minio-data:
  kerp-clamav-db:
